name: Actualizar noticias y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar traducciones guardadas
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: traducciones-${{ github.run_id }}
          restore-keys: traducciones-
      - name: Recuperar la instantánea de FIDE subida desde el equipo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: fide-data
          path: fide-data
      - name: Recuperar datos de Elo guardados
        uses: actions/cache/restore@v4
        with:
          path: data/elo
          key: elo-v2-ninguna
          restore-keys: elo-v2-
      - name: Actualizar Elo FIDE y FADA (solo si hay listas nuevas)
        continue-on-error: true
        run: |
          mkdir -p data/elo
          {
            date -u +"%Y-%m-%d %H:%M UTC"
            curl -sS -m 15 -o /dev/null -r 0-0 -w "Diagnóstico FIDE: HTTP %{http_code} en %{time_total}s\n" https://ratings.fide.com/download/standard_rating_list_xml.zip || echo "Diagnóstico FIDE: sin respuesta desde GitHub"
            python -u scripts/build_elo.py 2>&1
          } | tee data/elo/build.log
      - name: Calcular huella de los datos de Elo
        id: elohash
        continue-on-error: true
        run: echo "valor=$(sha256sum data/elo/meta.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Guardar datos de Elo (solo si han cambiado)
        if: steps.elohash.outputs.valor != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/elo
          key: elo-v2-${{ steps.elohash.outputs.valor }}
      - name: Descargar noticias
        run: python scripts/update_news.py
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html torneos-live.html torneos-proximos.html elo.html tactica.html assets css js data _site/
          # versión en cada despliegue: el navegador no usa CSS/JS antiguos
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
