name: Actualizar noticias y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar traducciones guardadas
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: traducciones-${{ github.run_id }}
          restore-keys: traducciones-
      - name: Descargar noticias
        run: python scripts/update_news.py
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html torneos-live.html torneos-proximos.html elo.html assets css js data _site/
          # versión en cada despliegue: el navegador no usa CSS/JS antiguos
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
