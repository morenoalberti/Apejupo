name = "apejupo-torneos"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Servicio independiente. No modifica el Worker de fotos, noticias ni Elo.
# TORNEOS_CLAVE se configura como secreto antes de una futura publicación.
[vars]
ALLOWED_ORIGINS = "https://apejupo.com,https://www.apejupo.com,http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8087,http://localhost:8087"

[[durable_objects.bindings]]
name = "TOURNAMENTS"
class_name = "TournamentRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "TournamentDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TournamentRoom", "TournamentDirectory"]
